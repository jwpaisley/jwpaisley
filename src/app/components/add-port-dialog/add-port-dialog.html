<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>

      <form class="form" [formGroup]="formGroup" (ngSubmit)="onConfirm()">
        <div class="field-group">
          <jwpaisley-form-input label="port name" placeholder="e.g. san francisco" formControlName="name" />
        </div>
        <div class="field-group">
          <jwpaisley-form-input label="latitude" placeholder="e.g. 33.76" formControlName="latitude" type="number" />
        </div>
        <div class="field-group">
          <jwpaisley-form-input label="longitude" placeholder="e.g. -118.19" formControlName="longitude" type="number" />
        </div>
      </form>
    </div>

    <div class="actions">
      <jwpaisley-button variant="primary" [text]="confirmLabel" [disabled]="!enableConfirmButton" (click)="onConfirm()"></jwpaisley-button>
      <jwpaisley-button variant="secondary" [text]="cancelLabel" (click)="onCancel()"></jwpaisley-button>
    </div>
  </div>
</div>
