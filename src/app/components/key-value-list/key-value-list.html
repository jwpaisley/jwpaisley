<div class="key-value-list" aria-label="key value list">
  @for (entry of entries; track entry.key) {
    <div class="key-value-row">
      <div class="key-group">
        @if (entry.imageUrl) {
          <span class="swatch swatch--image" [style.background-image]="'url(' + entry.imageUrl + ')'" aria-label="{{ entry.key }} icon"></span>
        } @else if (entry.color) {
          <span class="swatch" [style.background]="entry.color" aria-label="{{ entry.key }} color"></span>
        }
        <span class="key">{{ entry.key }}</span>
      </div>
      <span class="value">{{ entry.value }}</span>
    </div>
  }
</div>
