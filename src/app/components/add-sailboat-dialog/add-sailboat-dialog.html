<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>

      <form class="form" [formGroup]="formGroup" (ngSubmit)="onConfirm()">
        <div class="field-group">
          <jwpaisley-form-input label="boat name" placeholder="enter boat name" formControlName="name" />
        </div>
        <div class="field-group">
          <jwpaisley-form-input label="make" placeholder="enter make" formControlName="make" />
        </div>
        <div class="field-group">
          <jwpaisley-form-input label="model" placeholder="enter model" formControlName="model" />
        </div>
        <div class="field-group">
          <jwpaisley-form-input label="home port" placeholder="enter home port" formControlName="homePort" />
        </div>
      </form>
    </div>

    <div class="actions">
      <jwpaisley-button variant="primary" [text]="confirmLabel" [disabled]="!enableConfirmButton" (click)="onConfirm()"></jwpaisley-button>
      <jwpaisley-button variant="secondary" [text]="cancelLabel" (click)="onCancel()"></jwpaisley-button>
    </div>
  </div>
</div>
