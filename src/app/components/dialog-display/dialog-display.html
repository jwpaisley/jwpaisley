@if (config()) {
  <div class="dialog-backdrop" (click)="handleCancel()">
    <div class="dialog-wrapper" (click)="$event.stopPropagation()">
      
      @switch (config()?.type) {
        @case ('confirm') {
          <jwpaisley-confirmation-dialog
            [icon]="config()?.icon || 'help_outline'"
            [title]="config()?.title || 'title'"
            [text]="config()?.text || 'text'"
            [confirmLabel]="config()?.confirmLabel || 'confirm'"
            [cancelLabel]="config()?.cancelLabel || 'cancel'"
            (confirm)="handleConfirm()"
            (cancel)="handleCancel()"
          />
        }

        @case ('emoji') {
          <jwpaisley-emoji-picker-dialog
            [icon]="config()?.icon || 'mood'"
            [title]="config()?.title || 'use emoji'"
            [value]="config()?.value || '🍲'"
            (confirm)="handleConfirm($event)"
            (cancel)="handleCancel()"
          />
        }

        @case ('add-recipe-tag') {
          <jwpaisley-add-recipe-tag-dialog
            (confirm)="handleConfirm($event)"
            (cancel)="handleCancel()"
          />
        }

        @case ('tag-selector') {
          <jwpaisley-tag-selector-dialog
            [title]="config()?.title || 'select tags'"
            [availableTags]="tagSelectorDialogData?.availableTags || []"
            [selectedTagIds]="tagSelectorDialogData?.selectedTagIds || []"
            (confirm)="handleConfirm($event)"
            (cancel)="handleCancel()"
          />
        }

        @default {
          <p>Unknown dialog type: {{ config()?.type }}</p>
        }
      }

    </div>
  </div>
}
