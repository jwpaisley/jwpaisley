<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>

      <form class="form" [formGroup]="formGroup" (ngSubmit)="onConfirm()">
        <div class="field-grid">
          <div class="field-group">
            <jwpaisley-form-input label="title" placeholder="enter post title" formControlName="title" />
          </div>
          <div class="field-group">
            <jwpaisley-form-input label="description" placeholder="enter a short description" formControlName="description" />
          </div>
          <div class="field-group">
            <div class="cover-upload-row">
              <div class="cover-upload-input">
                <jwpaisley-form-input label="cover photo url" placeholder="https://..." formControlName="coverPhotoUrl" />
              </div>
              <jwpaisley-button variant="secondary" text="" [icon]="'upload'" (click)="triggerCoverUpload()" aria-label="Upload cover image"></jwpaisley-button>
            </div>
            <input id="create-post-cover-upload-input" type="file" accept="image/*" hidden (change)="onCoverPhotoSelected($event)" />
          </div>
          <div class="field-group">
            <jwpaisley-form-select label="post type" placeholder="select type" [options]="postTypeOptions" formControlName="type" />
          </div>
          <div class="field-group">
            <jwpaisley-form-select label="status" placeholder="select status" [options]="postStatusOptions" formControlName="status" />
          </div>
        </div>

        <div class="field-group">
          <div class="content-upload-row">
            <label class="content-upload-label">content</label>
            <jwpaisley-button variant="secondary" text="" [icon]="'upload'" (click)="triggerMarkdownImageUpload()" aria-label="Upload markdown image"></jwpaisley-button>
          </div>
          <input id="create-post-markdown-upload-input" type="file" accept="image/*" hidden (change)="onMarkdownImageSelected($event)" />
          <jwpaisley-markdown-input label="" placeholder="write your post here..." formControlName="content" />
        </div>
      </form>
    </div>

    <div class="actions">
      <jwpaisley-button variant="primary" [text]="confirmLabel" [disabled]="!enableConfirmButton" (click)="onConfirm()"></jwpaisley-button>
      <jwpaisley-button variant="secondary" [text]="cancelLabel" (click)="onCancel()"></jwpaisley-button>
    </div>
  </div>
</div>
