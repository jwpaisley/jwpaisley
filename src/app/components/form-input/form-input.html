<div class="input-wrapper" [class]="'size-' + size" [class.disabled]="disabled">
  @if (label) {
    <label class="input-label" [for]="inputId">{{ label }}</label>
  }

  <div class="input-container">
    @if (prefix) {
      <span class="input-prefix">{{ prefix }}</span>
    }
    <input
      [id]="inputId"
      [type]="type"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="handleInput($event)"
      (blur)="onTouched()"
      class="input"
    />
    @if (suffix) {
      <span class="input-suffix">{{ suffix }}</span>
    }
  </div>
</div>
