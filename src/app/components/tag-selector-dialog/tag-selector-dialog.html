<div class="dialog-backdrop" (click)="handleCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="handleCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="icon-header">
      <div class="icon-circle">
        <mat-icon>sell</mat-icon>
      </div>
    </div>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>
    </div>

    <div class="input-section">
      <jwpaisley-tags-list
        [tags]="tagsForDisplay"
        (tagSelected)="onTagSelect($event)"
        (tagUnselected)="onTagUnselect($event)"
      ></jwpaisley-tags-list>
    </div>

    <div class="actions">
      <jwpaisley-button
        variant="primary"
        [text]="confirmLabel"
        (click)="handleConfirm()"
      ></jwpaisley-button>
      <jwpaisley-button
        variant="secondary"
        [text]="cancelLabel"
        (click)="handleCancel()"
      ></jwpaisley-button>
    </div>
  </div>
</div>
