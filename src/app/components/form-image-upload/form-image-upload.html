<div class="input-wrapper">
  @if (label) {
    <label class="input-label">{{ label | lowercase }}</label>
  }

  <div class="image-grid" role="list">
    @for (image of value; track image.name) {
      <div class="image-tile" role="listitem" (click)="selectImage(image)">
        <img [src]="image.url" [alt]="image.name" />
        @if (getUploadState(image) === 'uploading') {
          <div class="upload-overlay upload-overlay--uploading" aria-label="uploading image">
            <mat-icon>cloud_upload</mat-icon>
          </div>
        }
        @if (getUploadState(image) === 'uploaded') {
          <div class="upload-overlay upload-overlay--uploaded" aria-label="uploaded image">
            <mat-icon>check</mat-icon>
          </div>
        }
        <button type="button" class="remove-button" [disabled]="lockEditing" (click)="$event.stopPropagation(); removeImage($index)">
          ×
        </button>
      </div>
    }

    @if (!isSelectionLimitReached) {
      <button
        type="button"
        class="image-tile add-tile"
        [disabled]="disabled || lockEditing"
        (click)="triggerPicker()"
      >
        <mat-icon>add_a_photo</mat-icon>
      </button>
    }
  </div>

  <input
    [id]="fileInputId"
    type="file"
    accept="image/*"
    [multiple]="maxImages === null || maxImages > 1"
    hidden
    (change)="handleFileSelection($event)"
  />
</div>
