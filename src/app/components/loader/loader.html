<div class="loader-wrapper" [class]="'loader-wrapper--' + size">
  @if (isLoading) {
    <div class="loader-overlay">
      <div class="loader" [class]="'loader--' + size">
        <div class="loader-stone" [class]="'loader-stone--' + size"></div>
        <div class="loader-ring" [class]="'loader-ring--' + size"></div>
      </div>
    </div>
  } @else {
    <ng-content></ng-content>
  }
</div>
