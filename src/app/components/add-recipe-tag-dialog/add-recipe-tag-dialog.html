<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="icon-header">
      <div class="icon-circle">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
    </div>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>
    </div>

    <form class="form" [formGroup]="formGroup" (ngSubmit)="onConfirm()">
      <jwpaisley-form-input
        label="name"
        placeholder="e.g. brunch"
        formControlName="name"
      />

      <jwpaisley-form-text-area
        label="description"
        placeholder="optional details"
        formControlName="description"
      />
    </form>

    <div class="actions">
      <jwpaisley-button
        variant="primary"
        [text]="confirmLabel"
        [disabled]="!enableConfirmButton"
        (click)="onConfirm()"
      ></jwpaisley-button>
      <jwpaisley-button
        variant="secondary"
        [text]="cancelLabel"
        (click)="onCancel()"
      ></jwpaisley-button>
    </div>
  </div>
</div>
