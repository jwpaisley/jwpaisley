<button
  *ngIf="!routerLink"
  class="btn"
  [class]="variant"
  [class.disabled]="disabled"
  [disabled]="disabled"
  [attr.aria-disabled]="disabled ? 'true' : null"
  [style.opacity]="disabled ? 0.6 : null"
  [style.pointer-events]="disabled ? 'none' : null"
  type="button"
  (click)="onClick($event)"
>
  {{ text }}
</button>

<a
  *ngIf="routerLink"
  class="btn"
  [class]="variant"
  [class.disabled]="disabled"
  [attr.aria-disabled]="disabled ? 'true' : null"
  [style.opacity]="disabled ? 0.6 : null"
  [style.pointer-events]="disabled ? 'none' : null"
  [routerLink]="routerLink"
  (click)="onClick($event)"
>
  {{ text }}
</a>
