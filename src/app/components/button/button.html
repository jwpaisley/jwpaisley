<button
  *ngIf="!routerLink"
  class="btn"
  [class]="variant"
  [class.disabled]="disabled"
  [disabled]="disabled"
  [attr.aria-disabled]="disabled ? 'true' : null"
  type="button"
  (click)="onClick($event)"
>
  <ng-content>
    {{ text }}
  </ng-content>
</button>

<a
  *ngIf="routerLink"
  class="btn"
  [class]="variant"
  [class.disabled]="disabled"
  [attr.aria-disabled]="disabled ? 'true' : null"
  [routerLink]="routerLink"
  (click)="onClick($event)"
>
  <ng-content>
    {{ text }}
  </ng-content>
</a>
