<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>

      <form class="form" [formGroup]="formGroup" (ngSubmit)="onConfirm()">
        <div class="field-group">
          <jwpaisley-form-input label="league name" placeholder="enter league name" formControlName="name" />
        </div>

        <div class="field-group">
          <jwpaisley-form-text-area label="league description" placeholder="describe the league" formControlName="description" />
        </div>

        <div class="field-group">
          <jwpaisley-form-select label="sport" placeholder="select a sport" [options]="sportOptions" formControlName="sport" />
        </div>

        <div class="field-group checkbox-field">
          <jwpaisley-form-checkbox label="private league" formControlName="isPrivate" />
        </div>

        <div class="field-row">
          <div class="field-group">
            <jwpaisley-form-input label="1st prize coins" type="number" placeholder="0" formControlName="firstPlacePrizeCoins" />
          </div>
          <div class="field-group">
            <jwpaisley-form-input label="2nd prize coins" type="number" placeholder="0" formControlName="secondPlacePrizeCoins" />
          </div>
          <div class="field-group">
            <jwpaisley-form-input label="3rd prize coins" type="number" placeholder="0" formControlName="thirdPlacePrizeCoins" />
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <jwpaisley-form-input label="api sports league id" type="number" placeholder="enter league id" formControlName="apiSportsLeagueId" />
          </div>
          <div class="field-group">
            <jwpaisley-form-input label="api sports season id" type="number" placeholder="enter season id" formControlName="apiSportsSeasonId" />
          </div>
        </div>
      </form>
    </div>

    <div class="actions">
      <jwpaisley-button variant="primary" [text]="confirmLabel" [disabled]="!enableConfirmButton" (click)="onConfirm()"></jwpaisley-button>
      <jwpaisley-button variant="secondary" [text]="cancelLabel" (click)="onCancel()"></jwpaisley-button>
    </div>
  </div>
</div>
