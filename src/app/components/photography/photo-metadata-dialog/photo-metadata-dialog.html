<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>edit photo details</h1>

      <div class="field-group">
        <jwpaisley-form-input
          label="caption"
          placeholder="ex: golden hour over the bay"
          [ngModel]="caption"
          (ngModelChange)="onCaptionChange($event)"
        ></jwpaisley-form-input>
      </div>

      <div class="field-group">
        <jwpaisley-form-input
          label="location"
          placeholder="ex: san francisco, ca"
          [ngModel]="location"
          (ngModelChange)="onLocationChange($event)"
        ></jwpaisley-form-input>
      </div>

      <div class="field-group">
        <jwpaisley-form-input
          label="taken date"
          type="text"
          placeholder="yyyy-mm-dd"
          [ngModel]="takenDate"
          (ngModelChange)="onTakenDateChange($event)"
        ></jwpaisley-form-input>
      </div>
    </div>

    <div class="actions">
      <jwpaisley-button variant="primary" (click)="onConfirm()">save</jwpaisley-button>
      <jwpaisley-button variant="secondary" (click)="onCancel()">cancel</jwpaisley-button>
    </div>
  </div>
</div>
