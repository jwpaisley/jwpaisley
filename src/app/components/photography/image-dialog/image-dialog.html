<div class="dialog-backdrop" *ngIf="isOpen" (click)="close()">
  <div class="dialog-shell" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <button class="close-button" type="button" (click)="close()" aria-label="Close image preview">
      <mat-icon>close</mat-icon>
    </button>

    <button class="secondary-button" type="button" (click)="openComments(); $event.stopPropagation()" aria-label="Open comments">
      <mat-icon>comment</mat-icon>
    </button>

    @if (isCommentsOpen) {
      <div class="comments-dialog-backdrop" (click)="closeComments()">
        <div class="comments-dialog-card" (click)="$event.stopPropagation()">
          <button class="comments-dialog__close" type="button" (click)="closeComments()" aria-label="Close comments">
            <mat-icon>close</mat-icon>
          </button>

          <div class="comments-dialog__content">
            <h3>comments</h3>
            <jwpaisley-comments-section [resourceId]="resourceId" [resourceType]="'PHOTO'"></jwpaisley-comments-section>
          </div>
        </div>
      </div>
    }

    <button *ngIf="showPrevious" class="nav-button nav-button-left" type="button" (click)="previous.emit()" aria-label="Previous image">
      <mat-icon>chevron_left</mat-icon>
    </button>

    <button *ngIf="showNext" class="nav-button nav-button-right" type="button" (click)="next.emit()" aria-label="Next image">
      <mat-icon>chevron_right</mat-icon>
    </button>

    <div class="image-frame" *ngIf="imageUrl; else noImage">
      <img [src]="imageUrl" alt="image preview" />
      <div class="caption-overlay" *ngIf="displayCaption">
        <span>{{ displayCaption }}</span>
      </div>
    </div>

    <ng-template #noImage>
      <div class="empty-state">No image available.</div>
    </ng-template>
  </div>
</div>
