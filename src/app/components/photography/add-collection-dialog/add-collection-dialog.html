<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>{{ dialogTitle }}</h1>
      <div class="field-group">
        <jwpaisley-form-input
          label="title"
          placeholder="ex: sailing trip to angel island"
          [ngModel]="title"
          (ngModelChange)="onTitleChange($event)"
        ></jwpaisley-form-input>
      </div>

      <div class="field-group">
        <jwpaisley-form-text-area
          label="description"
          placeholder="ex: photos from my recent sailing trip to angel island with some friends"
          [ngModel]="description"
          (ngModelChange)="onDescriptionChange($event)"
        ></jwpaisley-form-text-area>
      </div>

      <div class="field-group">
        <jwpaisley-form-input
          label="location"
          placeholder="ex: san francisco, ca"
          [ngModel]="location"
          (ngModelChange)="onLocationChange($event)"
        ></jwpaisley-form-input>
      </div>

      <div class="field-group">
        <jwpaisley-form-image-upload
          label="images"
          [ngModel]="images"
          (ngModelChange)="onImagesChange($event)"
          (imageSelect)="onImageSelect($event)"
        ></jwpaisley-form-image-upload>
      </div>
    </div>

    <div class="actions">
      <jwpaisley-button
        variant="primary"
        [text]="confirmLabel"
        [disabled]="disableCreateButton"
        (click)="onConfirm()"
      ></jwpaisley-button>
      <jwpaisley-button variant="secondary" text="cancel" (click)="onCancel()"></jwpaisley-button>
    </div>
  </div>
</div>

@if (showPhotoMetadataDialog && selectedImage) {
  <jwpaisley-photo-metadata-dialog
    [image]="selectedImage"
    (confirm)="onPhotoMetadataConfirm($event)"
    (cancel)="closePhotoMetadataDialog()"
  ></jwpaisley-photo-metadata-dialog>
}
