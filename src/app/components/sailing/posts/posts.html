<div class="sailing-section">
  @if (isUserAdmin) {
    <jwpaisley-action-dock>
      <jwpaisley-action-dock-button icon="add" variant="primary" action="add"></jwpaisley-action-dock-button>
    </jwpaisley-action-dock>
  }

  <div class="section-header">
    @if (isUserAdmin) {
      <h2 class="section-title">drafts</h2>
      <jwpaisley-loader [isLoading]="isLoadingDrafts">
        @if (draftPosts.length > 0) {
          <jwpaisley-card-grid [largeColumns]="3" [mediumColumns]="2" [smallColumns]="1">
            @for (post of draftPosts; track post.id) {
              <jwpaisley-post-card [post]="post" />
            }
          </jwpaisley-card-grid>
        } @else {
          <jwpaisley-empty-state
            emoji="✍️"
            title="no drafts yet"
            subtitle="posts will appear here once they are drafted"
          ></jwpaisley-empty-state>
        }
      </jwpaisley-loader>
    }

    <h2 class="section-title">posts</h2>
    <jwpaisley-loader [isLoading]="isLoadingPosts">
      @if (publishedPosts.length > 0) {
        <jwpaisley-card-grid [largeColumns]="3" [mediumColumns]="2" [smallColumns]="1">
          @for (post of publishedPosts; track post.id) {
            <jwpaisley-post-card [post]="post" />
          }
        </jwpaisley-card-grid>
      } @else {
        <jwpaisley-empty-state
          emoji="📝"
          title="no posts yet"
          subtitle="posts will appear here once they are published"
        ></jwpaisley-empty-state>
      }
    </jwpaisley-loader>
  </div>
</div>
