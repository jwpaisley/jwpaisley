<div class="dialog-backdrop" (click)="onCancel()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <button class="close-x" type="button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>

    <div class="content">
      <h1>{{ title }}</h1>
      <p>{{ text }}</p>

      <form class="form" [formGroup]="formGroup" (ngSubmit)="onConfirm()">
        <div class="field-grid">
          <div class="field-group">
            <jwpaisley-form-input label="title / description" placeholder="enter post title" formControlName="description" />
          </div>
          <div class="field-group">
            <jwpaisley-form-input label="cover photo url" placeholder="https://..." formControlName="coverPhotoUrl" />
          </div>
          <div class="field-group">
            <jwpaisley-form-select label="post type" placeholder="select type" [options]="postTypeOptions" formControlName="type" />
          </div>
          <div class="field-group">
            <jwpaisley-form-select label="status" placeholder="select status" [options]="postStatusOptions" formControlName="status" />
          </div>
        </div>

        <div class="field-group">
          <jwpaisley-form-text-area label="content" placeholder="write your post here..." formControlName="content" />
        </div>
      </form>
    </div>

    <div class="actions">
      <jwpaisley-button variant="primary" [text]="confirmLabel" [disabled]="!enableConfirmButton" (click)="onConfirm()"></jwpaisley-button>
      <jwpaisley-button variant="secondary" [text]="cancelLabel" (click)="onCancel()"></jwpaisley-button>
    </div>
  </div>
</div>
